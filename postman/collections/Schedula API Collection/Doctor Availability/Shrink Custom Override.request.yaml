$kind: http-request
url: "{{baseUrl}}/doctor/availability/override/shrink/:id"
method: PATCH
body:
  type: json
  content: |-
    {
        "startTime": "03:00 PM",
        "endTime": "04:00 PM"
    }
auth:
  type: bearer
  credentials:
    token: "{{jwtToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 5500
