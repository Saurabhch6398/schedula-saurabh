$kind: http-request
url: "{{baseUrl}}/doctor/availability/:id"
method: PATCH
pathVariables:
  id: "1"
body:
  type: json
  content: |-
    {
        "startTime": "09:00 AM",
        "endTime": "12:00 PM"
    }
auth:
  type: bearer
  credentials:
    token: "{{jwtToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 3000
