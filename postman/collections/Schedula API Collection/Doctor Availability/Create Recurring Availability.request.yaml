$kind: http-request
url: "{{baseUrl}}/doctor/availability"
method: POST
body:
  type: json
  content: |-
    {
        "dayOfWeek": "MONDAY",
        "startTime": "10:00 AM",
        "endTime": "01:00 PM"
    }
auth:
  type: bearer
  credentials:
    token: "{{jwtToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });
    language: text/javascript
order: 1000
