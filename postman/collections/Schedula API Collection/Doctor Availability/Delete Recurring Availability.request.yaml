$kind: http-request
url: "{{baseUrl}}/doctor/availability/:id"
method: DELETE
pathVariables:
  id: "1"
auth:
  type: bearer
  credentials:
    token: "{{jwtToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 4000
