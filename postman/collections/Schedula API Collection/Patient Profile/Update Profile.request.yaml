$kind: http-request
url: "{{baseUrl}}/patient/profile"
method: PATCH
body:
  type: json
  content: |-
    {
        "healthInfo": "Diabetic, under treatment"
    }
auth:
  type: bearer
  credentials:
    token: "{{jwtToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Update success check", function () {
          const response = pm.response.json();
          pm.expect(response.message).to.equal("Patient profile updated successfully");
      });
    language: text/javascript
order: 4000
