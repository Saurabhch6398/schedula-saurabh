$kind: http-request
url: "{{baseUrl}}/patient/profile"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{jwtToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Check profile properties", function () {
          const response = pm.response.json();
          pm.expect(response.fullName).to.equal("Amit Kumar");
          pm.expect(response.age).to.equal(24);
      });
    language: text/javascript
order: 3000
