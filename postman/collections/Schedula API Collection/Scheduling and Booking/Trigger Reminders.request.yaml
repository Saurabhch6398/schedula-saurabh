$kind: http-request
url: "{{baseUrl}}/appointments/reminders/trigger"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{jwtToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Check reminders success response", function () {
          const response = pm.response.json();
          pm.expect(response.success).to.be.true;
          pm.expect(response.message).to.contain("reminders generated successfully");
          pm.expect(response.data.sent).to.be.a("number");
      });
    language: text/javascript
order: 9000
