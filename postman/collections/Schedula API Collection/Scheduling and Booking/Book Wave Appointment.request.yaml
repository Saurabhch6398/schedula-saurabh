$kind: http-request
url: "{{baseUrl}}/appointments"
method: POST
body:
  type: json
  content: |-
    {
        "doctorId": 1,
        "waveId": 1
    }
auth:
  type: bearer
  credentials:
    token: "{{jwtToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 or 409", function () {
          pm.expect(pm.response.code).to.be.oneOf([201, 409]);
      });
    language: text/javascript
order: 5000
