$kind: http-request
url: "{{baseUrl}}/appointments/1/cancel"
method: PATCH
body:
  type: json
  content: |-
    {
        "cancellationReason": "Patient rescheduled or cancelled"
    }
auth:
  type: bearer
  credentials:
    token: "{{jwtToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Cancelled successfully", function () {
          const response = pm.response.json();
          pm.expect(response.success).to.be.true;
          pm.expect(response.message).to.equal("Appointment cancelled successfully");
      });
    language: text/javascript
order: 6000
