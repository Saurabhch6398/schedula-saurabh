$kind: http-request
url: "{{baseUrl}}/doctor/:id/waves?date=2030-08-20"
method: GET
pathVariables:
  id: "1"
queryParams:
  date: "2030-08-20"
auth:
  type: bearer
  credentials:
    token: "{{jwtToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Should return waves array", function () {
          const response = pm.response.json();
          pm.expect(response).to.be.an("array");
      });
    language: text/javascript
order: 3000
