$kind: http-request
url: "{{baseUrl}}/doctor/profile"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{jwtToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Check profile properties", function () {
          const response = pm.response.json();
          pm.expect(response.fullName).to.equal("Dr. Rahul Sharma");
          pm.expect(response.specialization).to.equal("Cardiologist");
      });
    language: text/javascript
order: 3000
