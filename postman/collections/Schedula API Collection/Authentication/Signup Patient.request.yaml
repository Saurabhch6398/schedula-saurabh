$kind: http-request
url: "{{baseUrl}}/signup"
method: POST
body:
  type: json
  content: |-
    {
        "name": "Amit Kumar",
        "email": "amit.kumar@example.com",
        "password": "password123",
        "role": "PATIENT"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 or 409", function () {
          pm.expect(pm.response.code).to.be.oneOf([201, 409]);
      });
    language: text/javascript
order: 2000
